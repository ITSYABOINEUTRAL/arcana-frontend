<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Arcana Summer Collection — Coming Soon. Subscribe for exclusive early access to the drop.">
    <meta property="og:title" content="Arcana — Summer Collection Coming Soon">
    <meta property="og:description" content="The wait is almost over. Subscribe for exclusive early access.">
    <meta property="og:image" content="https://www.shop-arcana.store/logo.png">
    <meta property="og:url" content="https://www.shop-arcana.store">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" href="logo.png" type="image/x-icon">
    <title>Arcana — Summer Collection Coming Soon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            min-height: 100vh;
            min-height: -webkit-fill-available;
        }

        body {
            font-family: 'Poppins', sans-serif;
            color: #fff;
            overflow-x: hidden;
        }

        /* ===== BACKGROUND IMAGE ===== */
        .landing-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: url('gallery%202.jpeg') no-repeat center center/cover;
            background-attachment: fixed;
        }

        .landing-bg::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.25);
        }

        .landing-bg::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.0) 50%, rgba(0,0,0,0.35) 100%);
        }

        .noise-overlay {
            position: fixed;
            inset: 0;
            z-index: 1;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            pointer-events: none;
        }

        /* ===== MAIN CONTAINER ===== */
        .landing-container {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 50px 20px 20px;
            max-width: 520px;
            margin: 0 auto;
            text-align: center;
        }

        /* ===== LOGO ===== */
        .landing-logo {
            width: 200px;
            height: auto;
            margin-bottom: 32px;
            filter: brightness(0) invert(1);
            animation: fadeInDown 1s ease-out;
        }

        /* ===== BADGE ===== */
        .drop-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #59493b;
            padding: 10px 28px;
            border-radius: 0;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: #fff;
            margin-bottom: 32px;
            animation: fadeInUp 1s ease-out 0.2s both;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
        }

        /* ===== COUNTDOWN ===== */
        .countdown-container {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 40px;
            animation: fadeInUp 1s ease-out 0.4s both;
            flex-wrap: wrap;
        }

        .countdown-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 70px;
        }

        .countdown-number {
            font-size: clamp(2.5rem, 7vw, 4rem);
            font-weight: 800;
            line-height: 1;
            color: #fff;
            letter-spacing: -0.02em;
            text-shadow: 0 2px 12px rgba(0,0,0,0.7);
        }

        .countdown-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: rgba(255, 255, 255, 0.8);
            margin-top: 6px;
            font-weight: 600;
            text-shadow: 0 1px 6px rgba(0,0,0,0.6);
        }

        .countdown-separator {
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 300;
            color: rgba(255, 255, 255, 0.5);
            align-self: flex-start;
            padding-top: 4px;
            display: none;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        @media (min-width: 480px) {
            .countdown-separator { display: block; }
        }

        /* ===== NEWSLETTER FORM ===== */
        .newsletter-section {
            width: 100%;
            max-width: 420px;
            animation: fadeInUp 1s ease-out 0.6s both;
        }

        .newsletter-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 16px;
            font-weight: 500;
            text-shadow: 0 1px 6px rgba(0,0,0,0.6);
        }

        .newsletter-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .newsletter-form input {
            width: 100%;
            padding: 18px 20px;
            background: rgba(0, 0, 0, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            outline: none;
            text-align: center;
            transition: border-color 0.3s;
            text-shadow: 0 1px 4px rgba(0,0,0,0.5);
        }

        .newsletter-form input::placeholder {
            color: rgba(255, 255, 255, 0.45);
        }

        .newsletter-form input:focus {
            border-color: #59493b;
        }

        .newsletter-form button {
            width: 100%;
            padding: 18px 28px;
            background: #59493b;
            color: #fff;
            border: 2px solid #59493b;
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .newsletter-form button:hover {
            background: transparent;
            color: #59493b;
        }

        .newsletter-form button:active {
            transform: scale(0.98);
        }

        .newsletter-note {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.65);
            margin-top: 12px;
            font-weight: 300;
            text-shadow: 0 1px 4px rgba(0,0,0,0.5);
        }

        /* Success message */
        .subscribe-success {
            display: none;
            padding: 16px 20px;
            background: rgba(89, 73, 59, 0.4);
            border: 1px solid rgba(89, 73, 59, 0.7);
            margin-top: 16px;
            font-size: 0.9rem;
            color: #c4a882;
        }

        .subscribe-success.show {
            display: block;
            animation: fadeInUp 0.5s ease;
        }

        /* ===== SOCIAL LINKS ===== */
        .social-section {
            margin-top: 40px;
            animation: fadeInUp 1s ease-out 0.8s both;
        }

        .social-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: rgba(255, 255, 255, 0.75);
            margin-bottom: 20px;
            font-weight: 500;
            text-shadow: 0 1px 6px rgba(0,0,0,0.6);
        }

        .social-links {
            display: flex;
            gap: 16px;
            justify-content: center;
        }

        .social-link {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.85);
            text-decoration: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
        }

        .social-link:hover {
            background: rgba(89, 73, 59, 0.35);
            border-color: #59493b;
            color: #c4a882;
            transform: translateY(-3px);
        }

        .social-link svg {
            width: 20px;
            height: 20px;
        }

        /* ===== FOOTER ===== */
        .landing-footer {
            margin-top: auto;
            padding-top: 40px;
            padding-bottom: 10px;
            animation: fadeInUp 1s ease-out 1s both;
        }

        .landing-footer p {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.55);
            letter-spacing: 0.05em;
            text-shadow: 0 1px 4px rgba(0,0,0,0.5);
        }

        /* ===== ANIMATIONS ===== */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== REDIRECT MESSAGE ===== */
        .redirect-message {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 100;
            background: #0a0a0a;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
        }

        .redirect-message.show {
            display: flex;
        }

        .redirect-message h2 {
            font-size: 2rem;
            font-weight: 700;
        }

        .redirect-message p {
            color: rgba(255, 255, 255, 0.6);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(89, 73, 59, 0.2);
            border-top-color: #59493b;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== MOBILE: DRASTICALLY LIGHTEN OVERLAY ===== */
        @media (max-width: 768px) {
            .landing-bg {
                background-attachment: scroll;
                background-position: center center;
            }
            .landing-bg::before {
                background: rgba(0, 0, 0, 0.05);
            }
            .landing-bg::after {
                background: linear-gradient(to bottom, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0.0) 50%, rgba(0,0,0,0.1) 100%);
            }
        }

        @media (max-width: 480px) {
            .landing-container {
                padding: 40px 16px 16px;
            }

            .landing-logo {
                width: 180px;
            }

            .countdown-box {
                min-width: 55px;
            }

            .countdown-number {
                font-size: 2.25rem;
            }
        }
    </style>
<base target="_blank">

    <script src="script.js"></script>

    <!-- Countdown Logic -->
    <script>
        (function() {
            const targetDate = new Date('2026-06-20T00:00:00').getTime();
            const daysEl = document.getElementById('days');
            const hoursEl = document.getElementById('hours');
            const minutesEl = document.getElementById('minutes');
            const secondsEl = document.getElementById('seconds');
            const redirectOverlay = document.getElementById('redirectOverlay');

            function updateCountdown() {
                const now = new Date().getTime();
                const diff = targetDate - now;

                if (diff <= 0) {
                    if (daysEl) daysEl.textContent = '00';
                    if (hoursEl) hoursEl.textContent = '00';
                    if (minutesEl) minutesEl.textContent = '00';
                    if (secondsEl) secondsEl.textContent = '00';
                    if (redirectOverlay) redirectOverlay.classList.add('show');
                    setTimeout(() => {
                        window.location.href = 'shop.html';
                    }, 3000);
                    return;
                }

                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((diff % (1000 * 60)) / 1000);

                if (daysEl) daysEl.textContent = String(days).padStart(2, '0');
                if (hoursEl) hoursEl.textContent = String(hours).padStart(2, '0');
                if (minutesEl) minutesEl.textContent = String(minutes).padStart(2, '0');
                if (secondsEl) secondsEl.textContent = String(seconds).padStart(2, '0');
            }

            updateCountdown();
            setInterval(updateCountdown, 1000);
        })();
    </script>
