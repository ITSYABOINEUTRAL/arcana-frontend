<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Arcana Summer Collection — Coming Soon. Subscribe for exclusive early access to the drop.">
    <meta property="og:title" content="Arcana — Summer Collection Coming Soon">
    <meta property="og:description" content="The wait is almost over. Subscribe for exclusive early access.">
    <meta property="og:image" content="https://www.shop-arcana.store/logo.png">
    <meta property="og:url" content="https://www.shop-arcana.store">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" href="logo.png" type="image/x-icon">
    <title>Arcana — Summer Collection Coming Soon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== BACKGROUND EFFECTS ===== */
        .landing-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(89, 73, 59, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(139, 106, 78, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(89, 73, 59, 0.08) 0%, transparent 50%);
        }

        .noise-overlay {
            position: fixed;
            inset: 0;
            z-index: 1;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            pointer-events: none;
        }

        /* ===== MAIN CONTAINER ===== */
        .landing-container {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            max-width: 900px;
            margin: 0 auto;
            text-align: center;
        }

        /* ===== LOGO ===== */
        .landing-logo {
            width: 160px;
            height: auto;
            margin-bottom: 40px;
            filter: brightness(0) invert(1);
            animation: fadeInDown 1s ease-out;
        }

        /* ===== BADGE ===== */
        .drop-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(89, 73, 59, 0.2);
            border: 1px solid rgba(139, 106, 78, 0.3);
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: #8B6A4E;
            margin-bottom: 32px;
            animation: fadeInUp 1s ease-out 0.2s both;
        }

        .drop-badge .pulse {
            width: 8px;
            height: 8px;
            background: #8B6A4E;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        /* ===== HEADLINE ===== */
        .landing-headline {
            font-size: clamp(2.5rem, 8vw, 5rem);
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -0.03em;
            margin-bottom: 16px;
            animation: fadeInUp 1s ease-out 0.4s both;
        }

        .landing-headline span {
            background: linear-gradient(135deg, #8B6A4E 0%, #c4a882 50%, #8B6A4E 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .landing-subtitle {
            font-size: clamp(1rem, 2.5vw, 1.25rem);
            font-weight: 300;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.6;
            max-width: 500px;
            margin: 0 auto 48px;
            animation: fadeInUp 1s ease-out 0.6s both;
        }

        /* ===== COUNTDOWN ===== */
        .countdown-container {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-bottom: 48px;
            animation: fadeInUp 1s ease-out 0.8s both;
            flex-wrap: wrap;
        }

        .countdown-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 24px 20px;
            min-width: 80px;
            backdrop-filter: blur(10px);
        }

        .countdown-number {
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 700;
            line-height: 1;
            display: block;
            background: linear-gradient(135deg, #fff 0%, #8B6A4E 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .countdown-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 8px;
            font-weight: 500;
        }

        .countdown-separator {
            font-size: 2rem;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.2);
            align-self: center;
            display: none;
        }

        @media (min-width: 480px) {
            .countdown-separator { display: block; }
        }

        /* ===== NEWSLETTER FORM ===== */
        .newsletter-section {
            width: 100%;
            max-width: 480px;
            animation: fadeInUp 1s ease-out 1s both;
        }

        .newsletter-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 16px;
            font-weight: 500;
        }

        .newsletter-form {
            display: flex;
            gap: 0;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 0;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.03);
            transition: border-color 0.3s;
        }

        .newsletter-form:focus-within {
            border-color: #8B6A4E;
        }

        .newsletter-form input {
            flex: 1;
            padding: 16px 20px;
            background: transparent;
            border: none;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            outline: none;
        }

        .newsletter-form input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .newsletter-form button {
            padding: 16px 28px;
            background: #59493b;
            color: #fff;
            border: none;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .newsletter-form button:hover {
            background: #8B6A4E;
        }

        .newsletter-form button:active {
            transform: scale(0.98);
        }

        .newsletter-note {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.35);
            margin-top: 12px;
            font-weight: 300;
        }

        /* Success message */
        .subscribe-success {
            display: none;
            padding: 16px 20px;
            background: rgba(89, 73, 59, 0.2);
            border: 1px solid rgba(139, 106, 78, 0.3);
            border-radius: 8px;
            margin-top: 16px;
            font-size: 0.9rem;
            color: #c4a882;
        }

        .subscribe-success.show {
            display: block;
            animation: fadeInUp 0.5s ease;
        }

        /* ===== SOCIAL LINKS ===== */
        .social-section {
            margin-top: 48px;
            animation: fadeInUp 1s ease-out 1.2s both;
        }

        .social-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 20px;
            font-weight: 500;
        }

        .social-links {
            display: flex;
            gap: 16px;
            justify-content: center;
        }

        .social-link {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.03);
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .social-link:hover {
            background: rgba(89, 73, 59, 0.3);
            border-color: #8B6A4E;
            color: #fff;
            transform: translateY(-3px);
        }

        .social-link svg {
            width: 20px;
            height: 20px;
        }

        /* ===== FOOTER ===== */
        .landing-footer {
            margin-top: auto;
            padding-top: 60px;
            animation: fadeInUp 1s ease-out 1.4s both;
        }

        .landing-footer p {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 0.05em;
        }

        /* ===== ANIMATIONS ===== */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== REDIRECT MESSAGE ===== */
        .redirect-message {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 100;
            background: #0a0a0a;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
        }

        .redirect-message.show {
            display: flex;
        }

        .redirect-message h2 {
            font-size: 2rem;
            font-weight: 700;
        }

        .redirect-message p {
            color: rgba(255, 255, 255, 0.6);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(139, 106, 78, 0.2);
            border-top-color: #8B6A4E;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .landing-container {
                padding: 30px 16px;
            }

            .countdown-box {
                padding: 16px 12px;
                min-width: 60px;
            }

            .countdown-number {
                font-size: 1.75rem;
            }

            .newsletter-form {
                flex-direction: column;
            }

            .newsletter-form button {
                width: 100%;
            }
        }
    </style>

    <script>
// ===== NEWSLETTER HANDLER =====
        function handleSubscribe(e) {
            e.preventDefault();
            const email = document.getElementById('emailInput').value;
            const successMsg = document.getElementById('successMessage');
            const form = document.getElementById('subscribeForm');

            // Here you would normally send to your backend/email service
            // For now, just show success message
            console.log('New subscriber:', email);

            // Show success
            successMsg.classList.add('show');
            form.reset();

            // Hide success after 5 seconds
            setTimeout(() => {
                successMsg.classList.remove('show');
            }, 5000);
        }
    </script>
